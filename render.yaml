# Render Blueprint for Cat GPT backend
# Deploy via: Render Dashboard -> New -> Blueprint -> select your repo
services:
  - type: web
    name: cat-gpt-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you'll paste this at deploy time
      - key: SESSION_SECRET
        generateValue: true  # Render generates a random one
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false          # e.g. http://localhost:3000,https://cat-gpt.vercel.app
